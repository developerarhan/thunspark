components:
  schemas:
    ArticleDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 250
        slug:
          type: string
          maxLength: 250
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
          description: Concise lead synopsis for index cards and meta descriptions.
          maxLength: 320
        content:
          type: string
        featured_image:
          type: string
          format: uri
        featured_image_alt:
          type: string
          maxLength: 200
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/Author'
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
        is_featured:
          type: boolean
        published_at:
          type: string
          format: date-time
          nullable: true
        reading_time:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Estimated minutes to read. Auto-calculated upon save.
        views_count:
          type: integer
          maximum: 2147483647
          minimum: 0
        faq_schema:
          description: 'Optional structured schema. Example: [{"question": "...",
            "answer": "..."}]'
        meta_title:
          type: string
          description: Primary SEO title (max 70 chars). Falls back to main title
            if empty.
          maxLength: 70
        meta_description:
          type: string
          description: Search engine snippet description (max 160 chars).
          maxLength: 160
        canonical_url:
          description: Canonical URL override. Blank will auto-generate based on slug.
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        og_title:
          type: string
          description: OpenGraph title for social media shares.
          maxLength: 70
        og_description:
          type: string
          description: OpenGraph description for social cards.
          maxLength: 200
        og_image:
          type: string
          format: uri
          nullable: true
          description: 1200x630px social card preview image.
        no_index:
          type: boolean
          description: Set True to instruct search bots not to index this entry.
      required:
      - author
      - category
      - content
      - excerpt
      - featured_image
      - id
      - slug
      - tags
      - title
    ArticleList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 250
        slug:
          type: string
          maxLength: 250
          pattern: ^[-a-zA-Z0-9_]+$
        excerpt:
          type: string
          description: Concise lead synopsis for index cards and meta descriptions.
          maxLength: 320
        featured_image:
          type: string
          format: uri
        featured_image_alt:
          type: string
          maxLength: 200
        category:
          allOf:
          - $ref: '#/components/schemas/Category'
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/Author'
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          readOnly: true
        is_featured:
          type: boolean
        published_at:
          type: string
          format: date-time
          nullable: true
        reading_time:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Estimated minutes to read. Auto-calculated upon save.
      required:
      - author
      - category
      - excerpt
      - featured_image
      - id
      - slug
      - tags
      - title
    Author:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 150
          pattern: ^[-a-zA-Z0-9_]+$
        role:
          type: string
          maxLength: 120
        bio:
          type: string
        avatar:
          type: string
          format: uri
          nullable: true
        linkedin_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
      required:
      - id
      - name
      - slug
    BlankEnum:
      enum:
      - ''
    BudgetEnum:
      enum:
      - under_1k
      - 1k_3k
      - 3k_5k
      - 5k_10k
      - 10k_plus
      type: string
      description: |-
        * `under_1k` - Under $1,000
        * `1k_3k` - $1,000–$3,000
        * `3k_5k` - $3,000–$5,000
        * `5k_10k` - $5,000–$10,000
        * `10k_plus` - $10,000+
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
      required:
      - id
      - name
      - slug
    GrowthStage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 60
        slug:
          type: string
          maxLength: 60
          pattern: ^[-a-zA-Z0-9_]+$
        step_number:
          type: integer
          maximum: 32767
          minimum: 0
          description: Order in pipeline (1-6)
        headline:
          type: string
          maxLength: 150
        description:
          type: string
          description: Clear explanation of the stage's purpose in the connected system.
        icon_name:
          type: string
          description: Lucide icon name
          maxLength: 60
      required:
      - description
      - id
      - name
      - slug
      - step_number
    HealthCheck:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
      required:
      - status
      - version
    HomepageContent:
      type: object
      properties:
        section_key:
          $ref: '#/components/schemas/SectionKeyEnum'
        badge:
          type: string
          maxLength: 80
        headline:
          type: string
          maxLength: 250
        subheadline:
          type: string
        cta_primary_label:
          type: string
          maxLength: 80
        cta_primary_url:
          type: string
          maxLength: 200
        cta_secondary_label:
          type: string
          maxLength: 80
        cta_secondary_url:
          type: string
          maxLength: 200
        extra_body:
          type: string
          title: Extra Content
      required:
      - headline
      - section_key
    IndustryCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
        tagline:
          type: string
          maxLength: 200
        description:
          type: string
          description: Focus areas, key challenges, and how we scale this category.
        icon_name:
          type: string
          description: Lucide icon name
          maxLength: 60
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Order index (lower numbers appear first).
      required:
      - description
      - id
      - name
      - slug
    LeadSubmission:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        company:
          type: string
          maxLength: 200
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        improvement_goal:
          type: string
          description: What are you trying to improve (bottleneck/challenge)?
        budget:
          oneOf:
          - $ref: '#/components/schemas/BudgetEnum'
          - $ref: '#/components/schemas/BlankEnum'
        message:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
