name: Frontend CI (Lint, Typecheck & Next.js Build)

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Linting
        run: |
          cd frontend
          npm run lint

      - name: Type checking
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Production Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          INTERNAL_API_URL: http://localhost:8000
        run: |
          cd frontend
          npm run build
