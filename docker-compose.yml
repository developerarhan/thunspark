services:
  db:
    image: postgres:16-alpine
    container_name: thunspark_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thunspark_db}
      POSTGRES_USER: ${POSTGRES_USER:-thunspark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thunspark_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thunspark_user} -d ${POSTGRES_DB:-thunspark_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    container_name: thunspark_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: thunspark_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://${POSTGRES_USER:-thunspark_user}:${POSTGRES_PASSWORD:-thunspark_pass}@db:5432/${POSTGRES_DB:-thunspark_db}
      - REDIS_URL=redis://redis:6379/1
      - NEXTJS_INTERNAL_URL=http://frontend:3000
      - DEBUG=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: thunspark_frontend
    restart: unless-stopped
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - INTERNAL_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3000
    depends_on:
      - backend
    ports:
      - "3000:3000"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: thunspark_celery
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DATABASE_URL=postgres://${POSTGRES_USER:-thunspark_user}:${POSTGRES_PASSWORD:-thunspark_pass}@db:5432/${POSTGRES_DB:-thunspark_db}
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  backend_media:
